sentence=A tiny LLM inference engine for ESP32/Arduino, running TGAI .TG models on-device.
paragraph=Supports FP16/INT8/Q8_0/Q4_0 weights, KV cache in PSRAM, built-in tokenizer (V3 word-list via Trie longest-match and V2.x BPE), streaming output, optional SD card loading, and a ready-to-use chat UI example (ST7735/ST7789) with a 12x12 Chinese bitmap font. Architecture support: TGAI V1/V2.x (MoE) and V3 (QK-Norm + Block AttnRes + MQA/GQA + dense or MoE FFN).

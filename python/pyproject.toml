[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgai-go"
version = "1.2.2"
description = "TGAI GO —— 纯 Python 的 TGAI 模型推理库（CPU 引擎，零编译安装）"
readme = "README.md"
requires-python = ">=3.8"
# ★ license 用 SPDX 字符串（2026-10-11 改）
#   原来写的是 license = { text = "MIT" }（TOML 表形式），
#   setuptools >= 77 已弃用，构建时会刷一大段警告并声明
#   2027-02-18 后不再支持。改成 SPDX 表达式即可（加 license-files 更规范）。
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TGAI" }]
keywords = ["tgai", "llm", "inference", "moe", "chinese", "llama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = [
    # 只有 numpy：采样与张量运算用
    "numpy>=1.20",
]

[project.optional-dependencies]
# 外部分词器（大词表模型的兜底方案；不装也能跑内置分词器）
tokenizer = ["tokenizers>=0.15"]
# 开发/测试
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/JXW666NB/TGAI-GO"
Issues = "https://github.com/JXW666NB/TGAI-GO/issues"
Documentation = "https://github.com/JXW666NB/TGAI-GO#readme"
Repository = "https://github.com/JXW666NB/TGAI-GO"

[project.scripts]
# 命令行入口（可选）：tgai-go chat -m model.TG
# 注意这只是薄封装，主要用法是 import tgai_go
tgai-go = "tgai_go.__main__:main"

[tool.setuptools]
# ★ _native 必须显式列出（2026-10-11 修）
#   它是只装 .dll 的数据目录、没有 __init__.py，但仍被 Python 视为
#   "可导入的包"。只写 packages = ["tgai_go"] 时 setuptools 会警告：
#     Package 'tgai_go._native' is absent from the `packages` configuration
#     -> Package would be ignored
#   虽然实测 DLL 仍被打进 wheel（靠 package-data），但该警告属"配置含糊"，
#   随时可能在某个 setuptools 版本变成真的丢文件。显式列出最稳。
packages = ["tgai_go", "tgai_go._native"]
include-package-data = true
zip-safe = false

# 让 examples/*.py 随 sdist 分发（用户 pip download 解压就能看到示例）
[tool.setuptools.data-files]
# 注意：不装到 site-packages 里（避免污染），只在 sdist 中保留
# setuptools 的 sdist 默认会带上 MANIFEST.in 里列出的文件
# —— 见同目录 MANIFEST.in

[tool.setuptools.package-data]
# ★ 原生引擎随包分发：用户 pip install 后无需编译
#   文件名由 build_wheel.py 按平台放置
"tgai_go" = ["_native/*.dll", "_native/*.so", "_native/*.dylib", "_native/README.md"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*", "*.c", "*.obj", "*.lib", "*.exp"]
